version: "3.9"

services:
  # ── PostgreSQL 15 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: neuroscan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: neuroscan
      POSTGRES_PASSWORD: neuroscan_pass
      POSTGRES_DB: neuroscan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuroscan -d neuroscan_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neuroscan_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://neuroscan:neuroscan_pass@postgres:5432/neuroscan_db
      SECRET_KEY: replace-with-a-random-secret-key
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: "100"
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000"
    ports:
      - "8000:8000"
    volumes:
      - upload_data:/app/uploads

  # ── pgAdmin (DB browser) ───────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: neuroscan_pgadmin
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@neuroscan.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"

  # ── React / Vite frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neuroscan_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

volumes:
  postgres_data:
  upload_data:
